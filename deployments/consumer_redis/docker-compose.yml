# Redis cache сервер (# ❌ Не сохраняем на диск, # ❌ Отключаем RDB снимки)
# При перезапуске данные теряются - это НОРМАЛЬНО
services:
  redis_cache:
    container_name: redis_cache_go
    image: redis:7-alpine
    command: redis-server
      --requirepass ${REDIS_CACHE_PASSWORD}
      --port 6379
      --maxclients 10000
      --timeout 0
      --tcp-keepalive 300
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly no
      --save ""
    ports:
      - '6379:6379'
    volumes:
      - redis_cache_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_CACHE_PASSWORD}',
          '-p',
          '6379',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  redis_cache_data:

networks:
  app-network:
    driver: bridge
