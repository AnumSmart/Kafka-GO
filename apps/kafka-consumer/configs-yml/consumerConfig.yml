# Базовые Kafka настройки
brokers:
  - 'localhost:9092'
  # можно указать несколько брокеров
topic: 'orders'
group_id: 'franz-consumer-group'

# Настройки fetch
min_bytes: 1
max_bytes: 10485760 # 10MB
max_wait: 1s

# Специфичные настройки franz-go consumer
consumer:
  enabled: true
  start_offset: 'latest' # earliest, latest, at_end, at_start
  commit_interval: 0 # 0 = manual commit
  session_timeout: 30s
  rebalance_timeout: 60s
  max_records_per_fetch: 1000
  disable_auto_commit: true
