# Конфигурация Kafka продьюсера для DLQ

# Брокеры (обычно те же, что и у консьюмера)
brokers:
  - 'localhost:9092'
  # можно добавить резервные брокеры:
  # - 'localhost:9093'

# Топик DLQ (обычно исходный топик + суффикс .dlq), суффикс берётся из настроек dlq
topic: 'orders'

# Настройки продьюсера
producer:
  enabled: true

  # Подтверждения (acks):
  # - -1 = все реплики (самый надежный)
  # - 0 = без подтверждений (самый быстрый)
  # - 1 = только лидер
  required_acks: -1

  # Максимальное количество повторных попыток
  max_retries: 3

  # Задержка между повторными попытками
  retry_backoff: 100ms

  # Включить идемпотентность (предотвращает дубликаты)
  idempotent: true

  # Размер батча (сообщения группируются для оптимизации)
  batch_bytes: 16384 # 16KB

  # Задержка батча (сколько ждать перед отправкой)
  batch_timeout: 1s

  # Сжатие (none, gzip, snappy, lz4, zstd)
  compression: 'snappy'

  # Таймауты
  timeout: 10s
  request_timeout: 5s

  # Максимальный размер сообщения (байты)
  max_record_size_bytes: 1048576 # 1MB

  # DLQ специфичные настройки (опционально)
  dlq:
    topic_suffix: '.dlq'
    include_error_headers: true
    send_timeout: 5s
    max_message_size: 1048576
