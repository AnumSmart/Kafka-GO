brokers:
  - localhost:9092
#  - localhost:9093
topic: 'orders'
group_id: 'franz-consumer-group'
batch_size: 100
batch_timeout: 5s
min_bytes: 1
max_bytes: 10485760
max_wait: 1s

consumer:
  enabled: true
  start_offset: 'latest'
  commit_interval: 0s # 0 = ручной коммит
  session_timeout: 30s
  rebalance_timeout: 60s
  max_records_per_fetch: 1000
  disable_auto_commit: true

producer:
  enabled: true
  required_acks: -1
  max_retries: 3
  idempotent: true
  batch_bytes: 16384
  batch_timeout: 1s
  compression: 'snappy'
  timeout: 10s
  request_timeout: 5s
  max_record_size_bytes: 1048576
  dlq:
    enabled: true
    topic_suffix: '.dlq'
    include_error_headers: true
    send_timeout: 5s
    max_message_size: 1048576
